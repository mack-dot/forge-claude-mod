name: "Forge check"
description: "Prove the checks in .forge/forge.json with Dafny, gate approvals, bypasses, builds, INVARIANTS.md and a differential fuzz sweep; fail the job on any finding"
branding:
  icon: check-circle
  color: green
# With no inputs, every gate that the project's .forge/forge.json makes possible runs. See docs/ci.md.
inputs:
  root:
    description: "Project folder that holds .forge/forge.json"
    required: false
    default: "."
  base:
    description: "Git ref to compare with for APPROVAL_CHANGED. Empty (default): taken from the event (pull_request: the base branch; merge_group: the base commit; push: the commit before the push; other events: not compared, and the job summary says so). \"none\" turns the comparison off (only for repositories whose approvals are test fixtures)."
    required: false
    default: ""
  build:
    description: "\"auto\" (default): run `build --check` when any check has a build entry (STALE_BUILD, APP_SYNTAX_ERROR, serviceTest NOT_CALLED). \"false\": skip it."
    required: false
    default: "auto"
  invariants:
    description: "\"true\" (default): INVARIANTS.md must equal a fresh generation (INVARIANTS_STALE otherwise). \"false\": skip it."
    required: false
    default: "true"
  diff:
    description: "\"auto\" (default): run the differential fuzz sweep when any check has diff entries. \"false\": skip it."
    required: false
    default: "auto"
  diff-inputs:
    description: "Random inputs per diff entry in the CI sweep"
    required: false
    default: "50000"
  diff-budget-seconds:
    description: "Time budget per diff entry, in seconds. The sweep stops at the input count or the budget, whichever comes first; the summary says when the budget cut it short."
    required: false
    default: "600"
  diff-tier:
    description: "\"ci\" or \"nightly\": take the sweep's input count, time budget and coverage-guided steering from the tier in .forge/forge.json \"fuzz.tiers\" (defaults: ci 100,000 inputs / 600 s, nightly 1,000,000 inputs / 3,600 s, both steered); diff-inputs and diff-budget-seconds are then ignored. Empty (default): diff-inputs and diff-budget-seconds, not steered."
    required: false
    default: ""
  diff-seed:
    description: "Seed for the sweep. Empty (default): the workflow run ID, so a re-run uses the same inputs. Printed in the summary."
    required: false
    default: ""
  dafny-version:
    description: "Dafny version to install"
    required: false
    default: "4.11.0"
  node-version:
    description: "Node version, installed only when a check uses JavaScript or TypeScript"
    required: false
    default: "24"
  go-version:
    description: "Go version, installed only when a check uses Go"
    required: false
    default: "1.22"
outputs:
  result:
    description: "pass or fail"
    value: ${{ steps.forge.outputs.result }}
  report:
    description: "Path of the JSON report (verdicts per gate)"
    value: ${{ steps.forge.outputs.report }}
runs:
  using: "composite"
  steps:
    - name: forge plan (which toolchains the checks use)
      id: plan
      shell: bash
      env:
        FORGE_ROOT: ${{ inputs.root }}
      run: python3 "$GITHUB_ACTION_PATH/cli/forge_ci.py" plan --root "$FORGE_ROOT"
    - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1.9.1
      with:
        dafny-version: ${{ inputs.dafny-version }}
    # After the Dafny setup, which installs an old Node for itself.
    - if: steps.plan.outputs.node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
    - if: steps.plan.outputs.go == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - if: steps.plan.outputs.go == 'true'
      shell: bash
      run: go install golang.org/x/tools/cmd/goimports@v0.24.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: forge (check, bypass, build --check, invariants --check, diff sweep)
      id: forge
      shell: bash
      env:
        FORGE_ROOT: ${{ inputs.root }}
        FORGE_BASE: ${{ inputs.base }}
        FORGE_BUILD: ${{ inputs.build }}
        FORGE_INVARIANTS: ${{ inputs.invariants }}
        FORGE_DIFF: ${{ inputs.diff }}
        FORGE_DIFF_INPUTS: ${{ inputs.diff-inputs }}
        FORGE_DIFF_BUDGET: ${{ inputs.diff-budget-seconds }}
        FORGE_DIFF_SEED: ${{ inputs.diff-seed }}
        FORGE_DIFF_TIER: ${{ inputs.diff-tier }}
      run: |
        build="$FORGE_BUILD"; [ "$build" = "true" ] && build=auto
        diff="$FORGE_DIFF"; [ "$diff" = "true" ] && diff=auto
        python3 "$GITHUB_ACTION_PATH/cli/forge_ci.py" run --root "$FORGE_ROOT" --base "$FORGE_BASE" \
          --build "$build" --invariants "$FORGE_INVARIANTS" --diff "$diff" \
          --inputs "$FORGE_DIFF_INPUTS" --budget-s "$FORGE_DIFF_BUDGET" --seed "$FORGE_DIFF_SEED" --tier "$FORGE_DIFF_TIER"
