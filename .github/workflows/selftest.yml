name: selftest
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1.9.1
        with:
          dafny-version: "4.11.0"
      - run: python3 tests/run_tests.py
  action-on-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          root: examples/wallet-cap
          build: "true"
  all-targets:
    # Fuzz and emit the example in all six targets on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1.9.1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go install golang.org/x/tools/cmd/goimports@v0.24.0
      - name: build the example for py, js, go, java, cs, rs
        run: |
          cd examples/wallet-cap
          python3 - <<'PY'
          import hashlib, json
          cfg = json.load(open('.forge/forge.json'))
          cfg['checks'][0]['build']['targets'] = ['py', 'js', 'go', 'java', 'cs', 'rs']
          json.dump(cfg, open('.forge/forge.json', 'w'))
          h = lambda p: hashlib.sha256(open(p, 'rb').read()).hexdigest()
          json.dump({'.forge/forge.json': h('.forge/forge.json'), 'spec/WalletSpec.dfy': h('spec/WalletSpec.dfy')},
                    open('.forge/approved.json', 'w'))
          PY
          python3 ../../cli/forge_check.py build --no-write
